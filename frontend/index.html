<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <title>RESqRoute - Smart Traffic & Emergency Vehicle Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Navbar -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v3"/>
            <path d="M18.36 5.64l-2.12 2.12"/>
            <path d="M5.64 5.64l2.12 2.12"/>
            <path d="M21 12h-3"/>
            <path d="M6 12H3"/>
            <path d="M7 12a5 5 0 0 1 10 0v5H7v-5z"/>
            <path d="M5 20h14"/>
          </svg>
        </div>
        <div>
          <h1>RESqRoute</h1>
          <p class="subtitle">Smart Traffic & Emergency Vehicle Management System</p>
        </div>
      </div>
    </header>

    <!-- Operations Bar (Single Master Action) -->
    <section class="action-bar">
      <button class="btn btn-warning" onclick="simulateEmergency()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v3"/>
          <path d="M18.36 5.64l-2.12 2.12"/>
          <path d="M5.64 5.64l2.12 2.12"/>
          <path d="M21 12h-3"/>
          <path d="M6 12H3"/>
          <path d="M7 12a5 5 0 0 1 10 0v5H7v-5z"/>
          <path d="M5 20h14"/>
        </svg>
        <span>Simulate Emergency</span>
      </button>
    </section>

    <!-- Main Grid Layout -->
    <main class="dashboard-grid">
      <!-- Left Sidebar: Dispatch & Metrics -->
      <aside class="sidebar-panel">
        <div class="card">
          <div class="card-header">
            <h2>Dispatch Unit</h2>
            <span class="tag">Active Call</span>
          </div>
          <form id="dispatch-form" onsubmit="handleDispatchSubmit(event)">
            <div class="form-group">
              <label for="vehicle-type">Vehicle Type</label>
              <select id="vehicle-type" class="form-control">
                <option value="Ambulance">Ambulance (Priority 10)</option>
                <option value="FireTruck">Fire Truck (Priority 9)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="vehicle-id">Unit ID / Call Sign</label>
              <input type="text" id="vehicle-id" class="form-control" value="AMB-911" placeholder="e.g. AMB-911" maxlength="20" autocomplete="off">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="start-node">Start Station</label>
                <select id="start-node" class="form-control">
                  <option value="1">1: Central Hospital</option>
                  <option value="2" selected>2: Fire Station #1</option>
                  <option value="3">3: Downtown Plaza</option>
                  <option value="4">4: Residential District</option>
                  <option value="5">5: Highway Interchange</option>
                  <option value="6">6: Industrial Park</option>
                </select>
              </div>
              <div class="form-group">
                <label for="end-node">Destination</label>
                <select id="end-node" class="form-control">
                  <option value="1">1: Central Hospital</option>
                  <option value="2">2: Fire Station #1</option>
                  <option value="3">3: Downtown Plaza</option>
                  <option value="4">4: Residential District</option>
                  <option value="5">5: Highway Interchange</option>
                  <option value="6" selected>6: Industrial Park</option>
                </select>
              </div>
            </div>
            <div class="form-group checkbox-group">
              <label class="toggle-switch">
                <input type="checkbox" id="emergency-mode" checked>
                <span class="slider"></span>
              </label>
              <span>Emergency Sirens & Shoulder Bypass</span>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              <span>Dispatch Emergency Unit</span>
            </button>
          </form>
        </div>

        <div class="card margin-top">
          <div class="telemetry-box">
            <div class="metric-row">
              <div class="metric">
                <span class="metric-label">Est. Travel Time</span>
                <span class="metric-value" id="telemetry-time">-- min</span>
              </div>
              <div class="metric">
                <span class="metric-label">Total Distance</span>
                <span class="metric-value" id="telemetry-distance">-- km</span>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Center Stage: Map Visualizer -->
      <section class="canvas-card card">
        <div class="canvas-header">
          <div class="canvas-title">
            <h2>Visualizer</h2>
            <span class="tag">Live</span>
          </div>
          <div class="canvas-legend">
            <div class="legend-item"><span class="color-box clear"></span> Clear</div>
            <div class="legend-item"><span class="color-box moderate"></span> Moderate</div>
            <div class="legend-item"><span class="color-box heavy"></span> Heavy Jam</div>
            <div class="legend-item"><span class="color-box path"></span> Active Corridor</div>
          </div>
        </div>
        <div class="canvas-container">
          <canvas id="cityCanvas"></canvas>
        </div>
      </section>
    </main>

    <footer class="app-footer"></footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
